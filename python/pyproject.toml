[project]
name = "sayay"
version = "0.1.0"
description = "AI Agent Cost Guardrails — budget enforcement for LLM calls. Check before, record after."
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Carlos Cortez", email = "carlos@cortez.cloud"}]
readme = "README.md"
keywords = ["ai", "guardrails", "budget", "cost", "llm", "agents", "rate-limit", "credits", "finops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=4.0"]

[project.urls]
Homepage = "https://github.com/breakingthecloud/sayay"
Repository = "https://github.com/breakingthecloud/sayay"
Issues = "https://github.com/breakingthecloud/sayay/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sayay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
